[project]
name = "egt"
version = "0.0.1"
description = "Evolutionary game theory simulator (replicator dynamics) for an MSc dissertation."
requires-python = ">=3.11"
# Concrete versions are pinned in requirements.txt; these are the import-time deps.
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run the test suite without an editable install: src/ is on the import path.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
